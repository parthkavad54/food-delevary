<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Order — FOODY</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script defer src="assets/script.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="./public/images/logo-mark.jpg" alt="FOODY logo" class="brand-mark" />
        <span class="brand-name">FOODY</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="restaurants.html" class="nav-link">Restaurants</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="reviews.html" class="nav-link">Reviews</a>
        <a href="order.html" class="button button-outline is-active" aria-current="page" id="nav-cart-link">Cart</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1 class="h2">Your Cart</h1>
          <p class="muted">Modify quantities, remove items, or continue shopping.</p>
        </div>

        <div id="cart-empty" class="empty-state" hidden>
          <p>Your cart is empty.</p>
          <div class="section-cta">
            <a href="menu.html" class="button">Browse Menu</a>
          </div>
        </div>

        <div id="cart-container" class="cart" hidden>
          <ul class="cart-list" id="cart-list">
             Items injected by JS 
          </ul>

          <aside class="cart-summary">
            <div class="summary-row">
              <span>Subtotal</span><span id="subtotal">₹0</span>
            </div>
            <div class="summary-row">
              <span>Delivery</span><span id="delivery">₹0</span>
            </div>
            <div class="summary-row total">
              <span>Total</span><span id="total">₹0</span>
            </div>
            <div class="summary-actions">
              <a href="menu.html" class="button button-ghost">Continue Shopping</a>
              <button class="button" id="checkout">Proceed to Checkout</button>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="muted">© <span id="year"></span> FOODY — With love ♥</p>
      <nav class="foot-nav">
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="menu.html">Menu</a>
        <a href="reviews.html">Reviews</a>
        <a href="order.html" aria-current="page">Order</a>
      </nav>
    </div>
  </footer>
</body>
</html>
